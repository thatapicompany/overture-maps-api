name: Rebuild Buildings Mirror (grid-partitioned)

# Rebuilds the grid-partitioned mirror of the Overture building table
# (etl/build-buildings-grid-mirror.sql) so /buildings and /places/buildings
# read only the grid cells a search touches instead of a gigabyte or more of
# the table. Runs monthly after Overture's release. The finished table
# replaces the live one in one step. Point the API at it with
# BUILDING_GRID_TABLE=overture-maps-api.overture.building_by_cell.
#
# The service account in GOOGLE_APPLICATION_CREDENTIALS needs BigQuery
# dataset create + table write in overture-maps-api and read on
# bigquery-public-data.overture_maps.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 25 * *' # 25th of each month, 04:30 UTC (after the places mirror rebuild)

jobs:
  build-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The grid-partitioned mirror (etl/build-buildings-grid-mirror.sql) is
      # what the API reads when BUILDING_GRID_TABLE is set. It is built
      # straight from the public table, so the geometry-only mirror
      # (etl/build-buildings-mirror.sql) is no longer rebuilt here; run that
      # file by hand if you use BUILDING_TABLE without the grid.
      - name: Rebuild grid-partitioned building mirror
        run: |
          bq query \
            --project_id="${{ secrets.BIGQUERY_PROJECT_ID }}" \
            --location=US \
            --use_legacy_sql=false \
            < etl/build-buildings-grid-mirror.sql
