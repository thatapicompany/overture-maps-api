name: Rebuild Buildings Mirror (clustered)

# Rebuilds the geometry-clustered mirror of the Overture building table
# (etl/build-buildings-mirror.sql) so /places/buildings and /buildings
# queries prune spatially instead of scanning the raw public table each
# time. Runs monthly after Overture's release. Idempotent (CREATE OR
# REPLACE). Point the API at it with
# BUILDING_TABLE=overture-maps-api.overture.building once the first build
# succeeds.
#
# The service account in GOOGLE_APPLICATION_CREDENTIALS needs BigQuery
# dataset create + table write in overture-maps-api and read on
# bigquery-public-data.overture_maps.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 25 * *' # 25th of each month, 04:30 UTC (after the places mirror rebuild)

jobs:
  build-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Rebuild clustered building mirror
        run: |
          bq query \
            --project_id="${{ secrets.BIGQUERY_PROJECT_ID }}" \
            --location=US \
            --use_legacy_sql=false \
            < etl/build-buildings-mirror.sql
