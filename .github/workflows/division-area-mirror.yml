name: Rebuild Division Area Mirror (clustered by id)

# Rebuilds the id-clustered mirror of the Overture division_area table
# (etl/build-division-area-mirror.sql) so GET /divisions/:id reads a block or
# two instead of scanning ~9.7GB. Runs monthly after the place mirrors.
# Idempotent (CREATE OR REPLACE). Point the API at it with
# DIVISION_AREA_TABLE=overture-maps-api.overture.division_area.
#
# Uses the same service account and secrets as places-mirror.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 25 * *' # 25th of each month, 05:30 UTC, after the place mirrors

jobs:
  build-division-area-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Rebuild id-clustered division_area mirror
        run: |
          bq query \
            --project_id="${{ secrets.BIGQUERY_PROJECT_ID }}" \
            --location=US \
            --use_legacy_sql=false \
            < etl/build-division-area-mirror.sql
