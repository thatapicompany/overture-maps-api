name: Live Endpoints E2E Tests

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  # Uncomment the following to run on push to main
  # push:
  #   branches: [ "main" ]

jobs:
  e2e-live-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suite calls the deployed API over HTTPS with an API key and needs
      # nothing else. Without the key Jest skips every test and reports
      # success, so a missing secret is made a failure here.
      - name: Check the test key is configured
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: |
          if [ -z "$TEST_API_KEY" ]; then
            echo "::error::The TEST_API_KEY repository secret is not set, so there is nothing to test with."
            exit 1
          fi

      - name: Run Live E2E Tests
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: npm run test:live
